<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rutas del Paisaje Cultural Cafetero</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
<header>
  <h1>Rutas del Paisaje Cultural Cafetero</h1>
  <nav>
    <button class="pestana activa" data-panel="ruta">Ruta origen–destino</button>
    <button class="pestana" data-panel="envolvente">Envolvente convexa</button>
    <button class="pestana" data-panel="itinerario">Itinerario de un día</button>
    <button class="pestana" data-panel="resultados">Resultados R1–R4</button>
  </nav>
</header>

<main>
  <div id="controles">
    <section id="panel-ruta" class="panel">
      <label>Origen <select id="origen"></select></label>
      <label>Destino <select id="destino"></select></label>
      <button id="calcular-ruta">Calcular ruta (Dijkstra con cola)</button>
      <p id="info-ruta" class="info"></p>
    </section>

    <section id="panel-envolvente" class="panel oculto">
      <button id="ver-envolvente">Dibujar envolvente de la red</button>
      <p id="info-envolvente" class="info"></p>
    </section>

    <section id="panel-itinerario" class="panel oculto">
      <label>Partida <select id="partida"></select></label>
      <p>Atractivos (entre 6 y 8):</p>
      <div id="lista-atractivos"></div>
      <button id="calcular-itinerario">Comparar Held-Karp y heurística</button>
      <div id="info-itinerario" class="info"></div>
    </section>

    <section id="panel-resultados" class="panel oculto">
      <label>Tabla
        <select id="tabla">
          <option>r1/tamano_red.csv</option>
          <option>r1/tiempo_componente.csv</option>
          <option>r2/cociente.csv</option>
          <option>r3/envolvente.csv</option>
          <option>r4/exactas.csv</option>
          <option>r4/calidad_heuristica.csv</option>
          <option>r4/itinerario.csv</option>
        </select>
      </label>
      <button id="ver-tabla">Ver tabla</button>
      <div id="contenido-tabla" class="info"></div>
      <div id="figuras"></div>
    </section>
  </div>
  <div id="mapa"></div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
